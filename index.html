<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qalima — шеберхана</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F5F1EA; --surface:#FFFFFF; --ink:#24201B; --muted:#6B635A; --line:#E3DBCF;
  --accent:#1F5F5B; --accent-ink:#FFFFFF; --accent-soft:#E3EFEC;
  --gold:#A8792B; --gold-soft:#F6ECD9; --ok:#2E7D4F; --ok-soft:#E3F2E8; --bad:#B23D2B; --bad-soft:#F8E4DF; --warn:#A86A12;
  --r:14px; --font:"Noto Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Noto Serif",Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#15130F; --surface:#1F1C17; --ink:#EEE8DF; --muted:#A79E92; --line:#35302A;
    --accent:#5BB5AC; --accent-ink:#0F1A19; --accent-soft:#1C302E; --gold:#D9A953; --gold-soft:#332816;
    --ok:#62C08A; --ok-soft:#18301F; --bad:#E5735E; --bad-soft:#3A1F1A; --warn:#E0A341;}
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
.wide .wrap{max-width:1100px}
header.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.bar .in{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:.3px}
.brand small{display:block;font-family:var(--font);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.sp{flex:1}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer;min-height:40px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
h1{font-family:var(--serif);font-size:26px;line-height:1.2;margin:22px 0 4px}
h2{font-size:19px;margin:28px 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{font-size:14px;font-weight:600;color:var(--muted)}
.lead{color:var(--muted);margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0}
.hero{background:var(--accent);color:var(--accent-ink);border:0}
.hero .lbl{opacity:.85;font-size:15px}
.hero .big{font-size:40px;font-weight:700;line-height:1.1;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.hero .row{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:15px;opacity:.95}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.block{width:100%}
.btn.small{min-height:40px;padding:8px 12px;font-size:15px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.list{list-style:none;margin:0;padding:0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:8px 0}
.item .top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:14px;color:var(--muted)}
.item .title{font-weight:600;margin-top:4px}
.item .sub{color:var(--muted);font-size:15px;margin-top:2px}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:13px;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.empty{color:var(--muted);padding:14px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.prod{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 6px;text-align:center;cursor:pointer;min-height:120px}
.prod svg{width:52px;height:52px;display:block;margin:4px auto 6px;color:var(--accent)}
.prod .n{font-weight:700}
.prod .p{font-size:13px;color:var(--muted)}
.prod.on{border-color:var(--accent);background:var(--accent-soft)}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0}
.stepper button{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:28px;font-weight:600;cursor:pointer}
.stepper input{width:90px;height:56px;text-align:center;font-size:28px;font-weight:700;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.qc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.qc .cell{border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.qc .cell .l{font-size:14px;font-weight:600}
.qc .cell.ok .l{color:var(--ok)} .qc .cell.rw .l{color:var(--warn)} .qc .cell.bd .l{color:var(--bad)}
.qc .mini{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.qc .mini button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:22px;cursor:pointer}
.qc .mini span{min-width:28px;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
label.f{display:block;margin:12px 0 4px;font-size:15px;font-weight:600}
input.t,select.t,textarea.t{width:100%;min-height:52px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
textarea.t{min-height:80px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{flex:1;min-width:30%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar-p{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar-p i{display:block;height:100%;background:var(--accent);border-radius:99px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:90vw;text-align:center}
.toast.bad{background:var(--bad);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.tabs button{white-space:nowrap}
table.tb{width:100%;border-collapse:collapse;font-size:15px}
table.tb th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line)}
table.tb td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.tb td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll-x{overflow-x:auto}
details.how{margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--accent-soft)}
details.how summary{cursor:pointer;padding:8px 12px;font-weight:600;font-size:15px;color:var(--accent);list-style:none}
details.how summary::-webkit-details-marker{display:none}
.how-body{white-space:pre-wrap;padding:0 12px 10px;font-size:15px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.note{font-size:14px;color:var(--muted)}
.login{max-width:420px;margin:0 auto;padding:40px 16px}
.login .logo{font-family:var(--serif);font-size:34px;font-weight:700;text-align:center;margin:20px 0 2px}
.login .tag{text-align:center;color:var(--muted);margin-bottom:24px}
.err{color:var(--bad);font-weight:600;margin-top:10px;min-height:1.4em}
.rules li{margin:6px 0}
.verdict-ok{color:var(--ok);font-weight:600} .verdict-bad{color:var(--bad);font-weight:600} .verdict-warn{color:var(--warn);font-weight:600}
.demo-banner{background:var(--gold-soft);color:var(--gold);text-align:center;font-size:14px;padding:6px 10px;font-weight:600}
</style>
</head>

function btn(label, cls, fn){ var b = el('button', 'btn' + (cls ? ' ' + cls : ''), label); b.type = 'button'; if (fn) b.addEventListener('click', function(){ fn(b); }); return b; }
function toast(msg, bad){ var n = $('toast'); n.textContent = msg; n.className = 'toast' + (bad ? ' bad' : ''); n.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ n.hidden = true; }, 2800); }
function section(title, count){ var h = el('h2', '', title); if (count !== undefined) h.appendChild(el('span', 'count', count)); return h; }
function empty(txt){ return el('div', 'empty', txt); }
function svgIcon(code){ var d = el('span'); d.innerHTML = ICON[code]; return d.firstChild; }
function todayISO(add){ var d = new Date(Date.now() + 5*3600*1000 + (add||0)*86400000); return d.toISOString().slice(0,10); }

/* ---------- API ---------- */
function rpc(fn, args){
  if (S.demo) return Promise.resolve(DEMO.rpc(fn, args || {}));
  return fetch(SB + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ 'apikey':KEY, 'Content-Type':'application/json' }, body: JSON.stringify(args || {}) })
    .then(function(r){ return r.text().then(function(txt){
      var j = null; try { j = JSON.parse(txt); } catch(e) {}
      if (!r.ok) {
        var msg = (j && j.message) || ('HTTP ' + r.status);
        if (msg === 'AUTH') { logout(true); }
        var e = new Error(msg); e.server = true; throw e;
      }
      return j;
    }); });
}
function act(b, fn, args, okMsg){
  if (b) b.disabled = true;
  return rpc(fn, args).then(function(res){
    if (res && res.ok === false) { if (b) b.disabled = false; toast(errText(res), true); return res; }
    if (okMsg) toast(okMsg);
    return load().then(function(){ return res; });
  }).catch(function(e){ if (b) b.disabled = false; toast(e.server ? t('error') : t('net'), true); });
}
function errText(res){
  if (res.error === 'sum') return t('sum_bad', {q: res.qty});
  if (res.error === 'reason') return t('reason_req');
  if (res.error === 'pin_format') return S.lang === 'kk' ? 'PIN 6 саннан тұруы керек.' : 'PIN должен состоять из 6 цифр.';
  if (res.error === 'bad_old') return S.lang === 'kk' ? 'Ескі PIN қате.' : 'Старый PIN неверный.';
  if (res.error === 'phone') return 'Номер: 8 7XX XXX XX XX';
  if (res.error === 'pin_required') return 'Для нового человека нужен PIN из 6 цифр.';
  if (res.error === 'self') return 'Нельзя отключить или понизить самого себя.';
  return t('error');
}

/* ---------- auth ---------- */
function logout(silent){
  if (S.token && !S.demo && !silent) rpc('portal_logout', {p_token:S.token}).catch(function(){});
  S.token = null; S.role = null; S.data = null; S.demo = false; persist(); renderLogin();
}

/* ---------- shell ---------- */
function start(){
  $('bar').hidden = false;
  $('demo-banner').hidden = !S.demo;
  $('demo-banner').textContent = S.demo ? 'ДЕМО — данные выдуманы. Для работы войдите по своему номеру.' : '';
  document.body.classList.toggle('wide', S.role === 'manager');
  paintBar();
  $('app').replaceChildren(el('div', 'wrap', t('loading')));
  load();
}
function paintBar(){
  $('bar-role').textContent = t('role_' + S.role) + (S.name ? ' · ' + S.name : '');
  $('lang-btn').textContent = t('lang');
  $('lang-btn').hidden = S.role === 'manager';
  $('logout-btn').textContent = t('logout');
}
$('lang-btn').onclick = function(){ S.lang = S.lang === 'kk' ? 'ru' : 'kk'; persist(); paintBar(); render(); };
$('logout-btn').onclick = function(){ logout(false); };
$('refresh-btn').onclick = function(){ load().then(function(){ toast(t('refresh') + ' ✓'); }); };

function load(){
  var fn = S.role === 'master' ? 'portal_master_home' : S.role === 'admin' ? 'portal_admin_home' : 'portal_manager_home';
  return rpc(fn, {p_token:S.token}).then(function(d){ S.data = d; render(); })
    .catch(function(e){ if (!S.token) return; $('app').replaceChildren(el('div', 'wrap', e.server ? t('error') : t('net'))); });
}
function render(){
  if (!S.data) return;
  var w = el('div', 'wrap');
  if (S.role === 'master') renderMaster(w, S.data);
  else if (S.role === 'admin') renderAdmin(w, S.data, true);
  else renderManager(w, S.data);
  $('app').replaceChildren(w);
}

function stepper(val, onChange, min, max){
  var box = el('div', 'stepper');
  var minus = el('button', '', '−'); minus.type = 'button';
  var inp = el('input'); inp.type = 'number'; inp.inputMode = 'numeric'; inp.value = val; inp.min = min; inp.max = max;
  var plus = el('button', '', '+'); plus.type = 'button';
  function set(v){ v = Math.max(min, Math.min(max, parseInt(v, 10) || min)); inp.value = v; onChange(v); }
  minus.onclick = function(){ set(Number(inp.value) - 1); };
  plus.onclick = function(){ set(Number(inp.value) + 1); };
  inp.onchange = function(){ set(inp.value); };
  box.append(minus, inp, plus); return box;
}

}
